name: Build and Deploy ElForecast to FTP

on:
  push:
    branches: [ "main" ]
    # Only the web app and what it is built from; changes to the WinForms app don't redeploy.
    paths:
      - "ElForecast/**"
      - "Stromligning/**"
      - ".github/workflows/deploy-elforecast.yml"
  workflow_dispatch: # Also allows a manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x # The project targets net10.0

      - name: Publish .NET App
        # The run number becomes the patch version (1.0.<run>), see ElForecast.csproj
        run: dotnet publish ElForecast/ElForecast.csproj -c Release -o release -p:BuildNumber=${{ github.run_number }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-output
          path: release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-output
          path: release

      # Uploads the static site (wwwroot/). Only changed files are sent after the first run.
      # Repository secrets (Settings > Secrets and variables > Actions):
      #   FTP_HOST      e.g. ftp.example.com
      #   FTP_USERNAME
      #   FTP_PASSWORD
      #   FTP_FOLDER    e.g. webroots/www/elforecast  (no trailing slash)
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_FOLDER }}/
          local-dir: ./release/wwwroot/
